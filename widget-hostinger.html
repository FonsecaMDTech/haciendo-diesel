<!-- ============================================================
     WIDGET DIÉSEL — Valle de Santiago | Haciendo
     Pega TODO esto en un elemento "Embed code" de Hostinger.
     Cambia UNA sola línea: DIESEL_JSON_URL (abajo) por tu URL real
     de GitHub Pages, p.ej.:
     https://TU-USUARIO.github.io/haciendo-diesel/diesel.json
     ============================================================ -->
<div id="hac-diesel" class="hac-diesel-card">
  <div class="hac-diesel-loading">Cargando precio del diésel…</div>
</div>

<style>
  .hac-diesel-card{
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    max-width: 340px; margin: 0 auto; padding: 20px 22px;
    border: 1px solid #e3e3e3; border-radius: 16px; background: #fff;
    box-shadow: 0 2px 10px rgba(0,0,0,.05); text-align: center; color:#1a1a1a;
  }
  .hac-diesel-top{ font-size:.8rem; letter-spacing:.05em; text-transform:uppercase;
    color:#6b7280; font-weight:600; }
  .hac-diesel-price{ font-size:2.6rem; font-weight:800; line-height:1.1;
    margin:.15em 0; color:#166534; }
  .hac-diesel-unit{ font-size:1rem; font-weight:600; color:#166534; }
  .hac-diesel-range{ font-size:.85rem; color:#4b5563; margin-top:.1em; }
  .hac-diesel-sub{ font-size:.8rem; color:#6b7280; margin-top:.5em; line-height:1.4; }
  .hac-diesel-date{ font-size:.72rem; color:#9ca3af; margin-top:.6em; }
  .hac-diesel-warn{ color:#9a3412; }
  .hac-diesel-err{ color:#b91c1c; font-weight:600; font-size:1rem; padding:.5em 0; }
  .hac-diesel-loading{ color:#9ca3af; font-size:.9rem; padding:1em 0; }
</style>

<script>
(function(){
  // ---- CAMBIA ESTA LÍNEA ----
  var DIESEL_JSON_URL = "https://TU-USUARIO.github.io/haciendo-diesel/diesel.json";
  // ---------------------------

  // Si el dato tiene más de estos días, NO mostramos precio (mostramos aviso).
  var MAX_DIAS_MOSTRAR = 7;

  var el = document.getElementById("hac-diesel");

  function esc(s){ return String(s).replace(/[<>&"]/g, function(c){
    return ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'})[c]; }); }

  function render(html){ el.innerHTML = html; }

  function mostrarError(msg){
    render('<div class="hac-diesel-top">⛽ Diésel — Valle de Santiago</div>'
      + '<div class="hac-diesel-err">' + esc(msg) + '</div>'
      + '<div class="hac-diesel-sub">Consulte precios oficiales en cne.gob.mx</div>');
  }

  function diasDesde(iso){
    var t = Date.parse(iso);
    if (isNaN(t)) return null;
    return Math.floor((Date.now() - t) / 86400000);
  }

  // Timeout defensivo por si Pages no responde.
  var timedOut = false;
  var timer = setTimeout(function(){ timedOut = true;
    mostrarError("Datos no disponibles"); }, 8000);

  fetch(DIESEL_JSON_URL, { cache: "no-store" })
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
    .then(function(d){
      if (timedOut) return;
      clearTimeout(timer);

      if (d == null || typeof d.diesel_promedio !== "number") {
        mostrarError("Datos no disponibles"); return;
      }

      // Freshness: preferimos la marca de tiempo del cálculo.
      var iso = d.actualizado_iso || d.fecha_archivo;
      var dias = iso ? diasDesde(iso) : null;
      if (dias === null || dias > MAX_DIAS_MOSTRAR) {
        render('<div class="hac-diesel-top">⛽ Diésel — Valle de Santiago</div>'
          + '<div class="hac-diesel-err hac-diesel-warn">Datos desactualizados</div>'
          + '<div class="hac-diesel-sub">No mostramos un precio viejo. '
          + 'Consulte cne.gob.mx para el dato vigente.</div>'
          + (d.actualizado_texto ? '<div class="hac-diesel-date">Último dato: '
              + esc(d.actualizado_texto) + '</div>' : ''));
        return;
      }

      var precio = d.diesel_promedio.toFixed(2);
      var n = d.estaciones_usadas || 0;
      var rango = (typeof d.min==="number" && typeof d.max==="number")
        ? ('Rango $' + d.min.toFixed(2) + ' – $' + d.max.toFixed(2)) : '';
      var fuente = d.fuente || 'CNE/SENER';
      var fecha = d.actualizado_texto || '';

      render(
        '<div class="hac-diesel-top">⛽ Diésel — Valle de Santiago</div>'
        + '<div class="hac-diesel-price">$' + esc(precio)
          + ' <span class="hac-diesel-unit">MXN/L</span></div>'
        + (rango ? '<div class="hac-diesel-range">' + esc(rango) + '</div>' : '')
        + '<div class="hac-diesel-sub">Promedio de ' + esc(n)
          + ' estaciones cercanas · Fuente: ' + esc(fuente) + '</div>'
        + (fecha ? '<div class="hac-diesel-date">Actualizado: ' + esc(fecha)
          + ' · Confirme en su gasolinera antes de cargar.</div>' : '')
      );
    })
    .catch(function(){
      if (timedOut) return;
      clearTimeout(timer);
      mostrarError("Datos no disponibles");
    });
})();
</script>
